        // Extract unique values
        const years = [...new Set(questions.map(q => q.year))].sort();
        const units = [...new Set(questions.map(q => q.unit))].sort((a, b) => a - b);
        const marksValues = [...new Set(questions.map(q => q.marks))].sort((a, b) => a - b);

        // Initialize filters
        function initFilters() {
            const yearFilters = document.getElementById('yearFilters');
            const unitFilters = document.getElementById('unitFilters');
            const marksFilters = document.getElementById('marksFilters');

            years.forEach(year => {
                const btn = createFilterButton(year, 'year');
                yearFilters.appendChild(btn);
            });

            units.forEach(unit => {
                const btn = createFilterButton(`Unit ${unit}`, 'unit', unit);
                unitFilters.appendChild(btn);
            });

            marksValues.forEach(mark => {
                const btn = createFilterButton(`${mark} Marks`, 'marks', mark);
                marksFilters.appendChild(btn);
            });
        }

        function createFilterButton(label, type, value) {
            const btn = document.createElement('button');
            btn.className = 'filter-btn';
            btn.textContent = label;
            btn.dataset.type = type;
            btn.dataset.value = value || label;
            
            btn.addEventListener('click', () => {
                btn.classList.toggle('active');
                toggleFilter(type, value || label);
            });
            
            return btn;
        }

        function toggleFilter(type, value) {
            const filterSet = activeFilters[type + 's'];
            if (filterSet.has(value)) {
                filterSet.delete(value);
            } else {
                filterSet.add(value);
            }
            filterQuestions();
        }

        function filterQuestions() {
            const searchTerm = activeFilters.search.toLowerCase();
            
            const filtered = questions.filter(q => {
                const matchesYear = activeFilters.years.size === 0 || activeFilters.years.has(q.year);
                const matchesUnit = activeFilters.units.size === 0 || activeFilters.units.has(q.unit);
                const matchesMarks = activeFilters.marks.size === 0 || activeFilters.marks.has(q.marks);
                const matchesSearch = !searchTerm || q.text.toLowerCase().includes(searchTerm);
                
                return matchesYear && matchesUnit && matchesMarks && matchesSearch;
            });

            displayQuestions(filtered);
        }

        function displayQuestions(questionsToShow) {
            const container = document.getElementById('questionsContainer');
            const resultsCount = document.getElementById('resultsCount');
            
            resultsCount.textContent = `Showing ${questionsToShow.length} of ${questions.length} questions`;

            if (questionsToShow.length === 0) {
                container.innerHTML = `
                    <div class="no-results">
                        <div class="no-results-icon">🔍</div>
                        <h2>No questions found</h2>
                        <p>Try adjusting your filters or search terms</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = questionsToShow.map(q => `
                <div class="question-card">
                    <div class="question-header">
                        <div class="question-tags">
                            <span class="tag year-tag">${q.year}</span>
                            <span class="tag unit-tag">Unit ${q.unit}</span>
                        </div>
                        <div class="marks-badge marks-${q.marks}">
                            ${q.marks} Marks
                        </div>
                    </div>
                    <div class="question-text">${q.text}</div>
                </div>
            `).join('');
        }

        // Search functionality
        document.getElementById('searchBox').addEventListener('input', (e) => {
            activeFilters.search = e.target.value;
            filterQuestions();
        });

        // Clear filters
        document.getElementById('clearFilters').addEventListener('click', () => {
            activeFilters = {
                years: new Set(),
                units: new Set(),
                marks: new Set(),
                search: ''
            };
            
            document.getElementById('searchBox').value = '';
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            
            filterQuestions();
        });

        // Initialize
        initFilters();
        displayQuestions(questions);
    </script>
