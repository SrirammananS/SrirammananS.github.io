<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Network Security | Analyzer Pro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #030308;
            --surface: rgba(15, 15, 25, 0.6);
            --surface-solid: #0d0d15;
            --glass-border: rgba(168, 85, 247, 0.2);
            --glass-shine: rgba(255, 255, 255, 0.05);

            --primary: #a855f7;
            --secondary: #3b82f6;
            --accent: #22d3ee;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --text-muted: #475569;

            --gradient-1: linear-gradient(135deg, #a855f7 0%, #3b82f6 100%);
            --gradient-2: linear-gradient(90deg, #a855f7, #3b82f6);
            --glow: 0 0 20px rgba(168, 85, 247, 0.3);

            --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg);
            background-image:
                radial-gradient(circle at 10% 10%, rgba(168, 85, 247, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 90% 90%, rgba(59, 130, 246, 0.08) 0%, transparent 40%);
            color: var(--text-main);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        .container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 2rem;
            width: 100%;
        }

        /* Animations */
        @keyframes fadeInBlur {
            from {
                opacity: 0;
                filter: blur(10px);
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                filter: blur(0);
                transform: translateY(0);
            }
        }

        .reveal {
            animation: fadeInBlur 0.8s var(--ease-in-out) forwards;
        }

        /* Header */
        header {
            padding: 3rem 0;
            text-align: center;
        }

        .hero-title {
            font-size: clamp(2.5rem, 8vw, 4.5rem);
            font-weight: 800;
            letter-spacing: -0.04em;
            background: var(--gradient-1);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
            line-height: 1.1;
        }

        .hero-subtitle {
            font-size: 1.25rem;
            color: var(--text-dim);
            font-weight: 400;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 1.5rem;
            margin-bottom: 4rem;
        }

        .stat-card {
            background: var(--surface);
            backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            padding: 2rem;
            border-radius: 24px;
            transition: all 0.4s var(--ease-in-out);
        }

        .stat-card:hover {
            transform: translateY(-8px) scale(1.02);
            border-color: rgba(168, 85, 247, 0.5);
            box-shadow: var(--glow);
        }

        .stat-label {
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.5rem;
        }

        .stat-value {
            font-size: 3rem;
            font-weight: 800;
            color: var(--text-main);
            letter-spacing: -0.02em;
        }

        /* Search & Controls */
        .controls-wrapper {
            background: var(--surface);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            padding: 1.5rem;
            margin-bottom: 3rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .search-container {
            position: relative;
            width: 100%;
        }

        .search-input {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 1.25rem 1.5rem 1.25rem 3.5rem;
            color: var(--text-main);
            font-family: inherit;
            font-size: 1.125rem;
            transition: all 0.3s ease;
            outline: none;
        }

        .search-input:focus {
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--primary);
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.2);
        }

        .search-icon {
            position: absolute;
            left: 1.5rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-dim);
            font-size: 1.25rem;
        }

        .filter-group {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            align-items: center;
        }

        select {
            background: var(--surface-solid);
            border: 1px solid var(--glass-border);
            color: var(--text-main);
            padding: 0.75rem 1.5rem;
            border-radius: 15px;
            font-family: inherit;
            font-size: 1rem;
            cursor: pointer;
            outline: none;
            transition: 0.3s;
        }

        select:hover {
            border-color: var(--primary);
        }

        .btn {
            background: var(--gradient-1);
            border: none;
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn:hover {
            transform: scale(1.05);
            box-shadow: var(--glow);
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--glass-border);
            color: var(--text-dim);
        }

        .btn-outline:hover {
            border-color: var(--primary);
            color: var(--text-main);
        }

        /* Sections */
        .section-box {
            background: var(--surface);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 32px;
            padding: 2.5rem;
            margin-bottom: 2.5rem;
            /* Remove overflow: hidden to prevent clipping shadow/hover effects */
        }

        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            user-select: none;
            /* Fix: Only pull to top, left, and right. NOT bottom. */
            margin: -2.5rem -2.5rem 0 -2.5rem;
            padding: 2.5rem;
            transition: background 0.3s ease;
            border-bottom: 1px solid transparent;
        }

        .section-header:hover {
            background: rgba(255, 255, 255, 0.03);
        }

        .section-title {
            font-size: 2rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 1rem;
            margin: 0;
        }

        .section-title::before {
            content: '';
            width: 8px;
            height: 32px;
            background: var(--gradient-1);
            border-radius: 4px;
        }

        .collapse-toggle {
            font-size: 1.5rem;
            color: var(--text-dim);
            transition: transform 0.4s var(--ease-in-out);
        }

        .collapsed .collapse-toggle {
            transform: rotate(-90deg);
        }

        .section-content-wrapper {
            display: grid;
            grid-template-rows: 1fr;
            transition: grid-template-rows 0.5s var(--ease-in-out);
        }

        .collapsed .section-content-wrapper {
            grid-template-rows: 0fr;
        }

        .section-content {
            overflow: hidden;
            min-height: 0;
            opacity: 1;
            transition: opacity 0.4s ease, padding 0.4s ease;
            padding-top: 2rem;
            padding-bottom: 2rem;
            /* Add padding at the bottom of the content */
        }

        .collapsed .section-content {
            opacity: 0;
            padding-top: 0;
            padding-bottom: 0;
        }

        /* Topic Grid */
        .topic-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1rem;
        }

        .topic-pill {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            padding: 1.25rem;
            border-radius: 20px;
            text-align: center;
            transition: 0.3s;
        }

        .topic-pill:hover {
            background: rgba(255, 255, 255, 0.08);
            transform: scale(1.05);
        }

        .topic-count {
            font-size: 1.75rem;
            font-weight: 800;
            color: var(--primary);
            display: block;
        }

        .topic-label {
            font-size: 0.875rem;
            color: var(--text-dim);
            font-weight: 500;
        }

        /* Question Cards */
        .q-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .q-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--glass-border);
            padding: 1.5rem;
            border-radius: 20px;
            transition: all 0.3s ease;
        }

        .q-card:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: var(--primary);
            transform: translateX(10px);
        }

        .q-top {
            display: flex;
            justify-content: space-between;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .q-txt {
            font-size: 1.125rem;
            font-weight: 500;
            color: var(--text-main);
        }

        .badge {
            font-size: 0.75rem;
            font-weight: 700;
            padding: 0.25rem 0.75rem;
            border-radius: 99px;
            white-space: nowrap;
        }

        .badge-year {
            background: rgba(59, 130, 246, 0.15);
            color: #60a5fa;
            border: 1px solid rgba(59, 130, 246, 0.3);
        }

        .badge-mark {
            background: rgba(168, 85, 247, 0.15);
            color: #c084fc;
            border: 1px solid rgba(168, 85, 247, 0.3);
        }

        .q-bottom {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 0.875rem;
            color: var(--text-dim);
        }

        .unit-tag {
            background: var(--surface-solid);
            padding: 0.2rem 0.6rem;
            border-radius: 8px;
            border: 1px solid var(--glass-border);
            font-weight: 600;
            color: var(--accent);
        }

        /* Footer */
        footer {
            margin-top: auto;
            padding: 4rem 0;
            text-align: center;
            border-top: 1px solid var(--glass-border);
            color: var(--text-muted);
            font-size: 0.875rem;
        }

        main {
            padding-bottom: 8rem;
        }

        @media (max-width: 768px) {
            .container {
                padding: 0 1.25rem;
            }

            .hero-title {
                font-size: 3rem;
            }

            .stats-grid {
                grid-template-columns: 1fr 1fr;
            }

            .filter-group {
                justify-content: stretch;
            }

            select {
                flex: 1;
            }
        }
    </style>
</head>

    <header class="reveal">
        <div class="container">
            <h1 class="hero-title">Network Security</h1>
            <p class="hero-subtitle">QP Intelligence & Analysis</p>
        </div>
    </header>

    <main class="container">

        <!-- Quick Stats -->
        <div class="stats-grid reveal" style="animation-delay: 0.2s;">
            <div class="stat-card">
                <div class="stat-label">Total Volume</div>
                <div class="stat-value" id="totalQuestions">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Unique Topics</div>
                <div class="stat-value" id="uniqueTopics">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Years Tracked</div>
                <div class="stat-value" id="yearsAnalyzed">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Hot Unit</div>
                <div class="stat-value" id="mostAskedUnit">-</div>
            </div>
        </div>

        <!-- Master Controls -->
        <div class="reveal" style="animation-delay: 0.4s;">
            <div class="controls-wrapper">
                <div class="search-container">
                    <span class="search-icon">🔍</span>
                    <input type="text" id="searchInput" class="search-input"
                        placeholder="Search questions or topics...">
                </div>
                <div class="filter-group">
                    <select id="unitFilter">

                        <option value="3">Unit 3</option>
                        <option value="4">Unit 4</option>
                        <option value="5">Unit 5</option>

                    <select id="markFilter">

                    <select id="yearFilter">
                        <option value="all">All Years</option>
                    </select>
                    <button class="btn" onclick="resetFilters()">Reset All</button>
                    <button class="btn btn-outline" id="globalToggle" onclick="toggleAllSections()">Collapse
                        All</button>
                </div>
            </div>
        </div>

        <!-- Visual Analysis -->
        <div class="section-box reveal" id="analysisSection" style="animation-delay: 0.6s;">
            <div class="section-header" onclick="toggleSection('analysisSection')">
                <h2 class="section-title">Analysis Matrix</h2>
                <span class="collapse-toggle">▼</span>
            </div>
            <div class="section-content-wrapper">
                <div class="section-content">
                    <div id="topicGrid" class="topic-grid"></div>
                </div>
            </div>
        </div>

        <!-- Question Archive -->
        <div class="section-box reveal" id="archiveSection" style="animation-delay: 0.8s;">
            <div class="section-header" onclick="toggleSection('archiveSection')">
                <h2 class="section-title">Question Archive</h2>
                <span class="collapse-toggle">▼</span>
            </div>
            <div class="section-content-wrapper">
                <div class="section-content">
                    <div id="qList" class="q-list"></div>
                </div>
            </div>
        </div>

    </main>

            <p>&copy; 2025 Network Security Intelligence Portal</p>

        let filtered = [...questionData];
        let allCollapsed = false;

        function init() {
            renderStats();
            renderTopics();
            renderArchive();
            populateYears();

            document.getElementById('searchInput').addEventListener('input', runFilters);
            document.getElementById('unitFilter').addEventListener('change', runFilters);
            document.getElementById('markFilter').addEventListener('change', runFilters);
            document.getElementById('yearFilter').addEventListener('change', runFilters);
        }

        function renderStats() {
            const stats = {
                total: questionData.length,
                topics: new Set(questionData.map(q => q.topic)).size,
                years: new Set(questionData.map(q => q.year)).size,
                units: {}
            };
            questionData.forEach(q => stats.units[q.unit] = (stats.units[q.unit] || 0) + 1);
            const hotUnit = Object.entries(stats.units).sort((a, b) => b[1] - a[1])[0][0];

            document.getElementById('totalQuestions').innerText = stats.total;
            document.getElementById('uniqueTopics').innerText = stats.topics;
            document.getElementById('yearsAnalyzed').innerText = stats.years;
            document.getElementById('mostAskedUnit').innerText = `Unit ${hotUnit}`;
        }

        function renderTopics() {
            const freq = {};
            questionData.forEach(q => freq[q.topic] = (freq[q.topic] || 0) + 1);
            const sorted = Object.entries(freq).sort((a, b) => b[1] - a[1]).slice(0, 12);

            const container = document.getElementById('topicGrid');
            container.innerHTML = sorted.map(([name, count]) => `
                <div class="topic-pill">
                    <span class="topic-count">${count}x</span>
                    <span class="topic-label">${name}</span>
                </div>
            `).join('');
        }

        function renderArchive() {
            const container = document.getElementById('qList');
            if (filtered.length === 0) {
                container.innerHTML = `<div style="text-align:center; padding: 4rem; color: var(--text-muted)">No intelligence matches these filters.</div>`;
                return;
            }
            container.innerHTML = filtered.map(q => `
                <div class="q-card">
                    <div class="q-top">
                        <span class="q-txt">${q.question}</span>
                        <div style="display:flex; gap: 0.5rem">
                            <span class="badge badge-year">${q.year}</span>
                            <span class="badge badge-mark">${q.marks}M</span>
                        </div>
                    </div>
                    <div class="q-bottom">
                        <span class="unit-tag">Unit ${q.unit}</span>
                        <span>•</span>
                        <span>${q.topic}</span>
                    </div>
                </div>
            `).join('');
        }

        function runFilters() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const unit = document.getElementById('unitFilter').value;
            const marks = document.getElementById('markFilter').value;
            const year = document.getElementById('yearFilter').value;

            filtered = questionData.filter(q => {
                const searchMatch = q.question.toLowerCase().includes(search) || q.topic.toLowerCase().includes(search);
                const unitMatch = unit === 'all' || q.unit == unit;
                const marksMatch = marks === 'all' || q.marks == marks;
                const yearMatch = year === 'all' || q.year == year;
                return searchMatch && unitMatch && marksMatch && yearMatch;
            });
            renderArchive();
        }

        function resetFilters() {
            document.getElementById('searchInput').value = '';
            document.getElementById('unitFilter').value = 'all';
            document.getElementById('markFilter').value = 'all';
            document.getElementById('yearFilter').value = 'all';
            filtered = [...questionData];
            renderArchive();
        }

        function populateYears() {
            const years = [...new Set(questionData.map(q => q.year))].sort().reverse();
            const el = document.getElementById('yearFilter');
            years.forEach(y => {
                const opt = document.createElement('option');
                opt.value = y;
                opt.textContent = y;
                el.appendChild(opt);
            });
        }

        /* Collapsible Logic */
        function toggleSection(sectionId) {
            const section = document.getElementById(sectionId);
            section.classList.toggle('collapsed');
            updateGlobalToggleState();
        }

        function toggleAllSections() {
            const sections = ['analysisSection', 'archiveSection'];
            const btn = document.getElementById('globalToggle');

            allCollapsed = !allCollapsed;

            sections.forEach(id => {
                const el = document.getElementById(id);
                if (allCollapsed) {
                    el.classList.add('collapsed');
                } else {
                    el.classList.remove('collapsed');
                }
            });

            btn.innerText = allCollapsed ? 'Expand All' : 'Collapse All';
        }

        function updateGlobalToggleState() {
            const sections = ['analysisSection', 'archiveSection'];
            const btn = document.getElementById('globalToggle');
            const allMatch = sections.every(id => document.getElementById(id).classList.contains('collapsed'));
            const noneMatch = sections.every(id => !document.getElementById(id).classList.contains('collapsed'));

            if (allMatch) {
                allCollapsed = true;
                btn.innerText = 'Expand All';
            } else if (noneMatch) {
                allCollapsed = false;
                btn.innerText = 'Collapse All';
            }
        }

        init();
    </script>
