        function getYearClass(year) {
            if (year.includes('2019')) return 'year-2019';
            if (year.includes('2020')) return 'year-2020';
            if (year.includes('2021')) return 'year-2021';
            if (year.includes('2022')) return 'year-2022';
            if (year.includes('2023')) return 'year-2023';
            if (year.includes('2024')) return 'year-2024';
            return '';
        }

        function getMarkClass(marks) {
            return `mark-${marks}`;
        }

        function toggleSection(sectionId) {
            const content = document.getElementById(`${sectionId}-content`);
            const icon = document.getElementById(`${sectionId}-icon`);

            content.classList.toggle('collapsed');
            icon.classList.toggle('collapsed');
        }

        function toggleAllSections() {
            const sections = ['topTopics', 'heatmap', 'questionList'];
            allSectionsCollapsed = !allSectionsCollapsed;

            sections.forEach(sectionId => {
                const content = document.getElementById(`${sectionId}-content`);
                const icon = document.getElementById(`${sectionId}-icon`);

                if (allSectionsCollapsed) {
                    content.classList.add('collapsed');
                    icon.classList.add('collapsed');
                } else {
                    content.classList.remove('collapsed');
                    icon.classList.remove('collapsed');
                }
            });

            event.target.textContent = allSectionsCollapsed ? 'Expand All' : 'Collapse All';
        }

        function calculateStats() {
            const stats = {
                totalQuestions: questionData.length,
                uniqueTopics: new Set(questionData.map(q => q.topic)).size,
                yearsAnalyzed: new Set(questionData.map(q => q.year)).size,
                unitCounts: {}
            };

            questionData.forEach(q => {
                stats.unitCounts[q.unit] = (stats.unitCounts[q.unit] || 0) + 1;
            });

            const mostAskedUnit = Object.entries(stats.unitCounts).sort((a, b) => b[1] - a[1])[0];
            stats.mostAskedUnit = `Unit ${mostAskedUnit[0]}`;

            return stats;
        }

        function calculateTopicFrequency() {
            const frequency = {};
            questionData.forEach(q => {
                if (!frequency[q.topic]) {
                    frequency[q.topic] = {
                        count: 0,
                        units: new Set(),
                        marks: new Set(),
                        years: new Set()
                    };
                }
                frequency[q.topic].count++;
                frequency[q.topic].units.add(q.unit);
                frequency[q.topic].marks.add(q.marks);
                frequency[q.topic].years.add(q.year);
            });

            return Object.entries(frequency)
                .map(([topic, data]) => ({
                    topic,
                    count: data.count,
                    units: Array.from(data.units),
                    marks: Array.from(data.marks),
                    years: Array.from(data.years)
                }))
                .sort((a, b) => b.count - a.count);
        }

        function renderStats() {
            const stats = calculateStats();
            document.getElementById('totalQuestions').textContent = stats.totalQuestions;
            document.getElementById('uniqueTopics').textContent = stats.uniqueTopics;
            document.getElementById('yearsAnalyzed').textContent = stats.yearsAnalyzed;
            document.getElementById('mostAskedUnit').textContent = stats.mostAskedUnit;
        }

            const topicFreq = calculateTopicFrequency();

                        </span>
                    </div>
                </div>
            `).join('');
        }

        function renderHeatmap() {
            const topicFreq = calculateTopicFrequency();

            heatmapEl.innerHTML = topicFreq.slice(0, 24).map(t => `

                    <div class="heatmap-topic">${t.topic}</div>
                    <div class="heatmap-count">${t.count}</div>
                </div>
            `).join('');

        function renderQuestions() {
            const questionListEl = document.getElementById('questionList');

            if (filteredData.length === 0) {
                questionListEl.innerHTML = '<p style="text-align: center; color: #a0a0a0; padding: 2rem;">No questions match the selected filters.</p>';
                return;
            }

            questionListEl.innerHTML = filteredData.map(q => `
                <div class="question-card">
                    <div class="question-header">
                        <div class="question-text">${q.question}</div>
                        <div class="question-meta">

                </div>
            `).join('');
        }

        function applyFilters() {
            const unitFilter = document.getElementById('unitFilter').value;
            const markFilter = document.getElementById('markFilter').value;
            const yearFilter = document.getElementById('yearFilter').value;

            filteredData = questionData.filter(q => {
                const unitMatch = unitFilter === 'all' || q.unit == unitFilter;
                const markMatch = markFilter === 'all' || q.marks == markFilter;
                const yearMatch = yearFilter === 'all' || q.year === yearFilter;
                return unitMatch && markMatch && yearMatch;
            });

            renderQuestions();
        }

        function resetFilters() {
            document.getElementById('unitFilter').value = 'all';
            document.getElementById('markFilter').value = 'all';
            document.getElementById('yearFilter').value = 'all';
            filteredData = [...questionData];
            renderQuestions();
        }

        function populateYearFilter() {
            const years = [...new Set(questionData.map(q => q.year))].sort().reverse();
            const yearFilter = document.getElementById('yearFilter');

            years.forEach(year => {
                const option = document.createElement('option');
                option.value = year;
                option.textContent = year;
                yearFilter.appendChild(option);
            });

            document.getElementById('unitFilter').addEventListener('change', applyFilters);
