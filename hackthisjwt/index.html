    <script>
        class JWTSecurityAnalyzer {
            constructor() {
                this.findings = [];
                this.init();
            }

            init() {
                document.getElementById('analyzeBtn').addEventListener('click', () => this.analyzeJWT());
                document.getElementById('jwtInput').addEventListener('keydown', (e) => {
                    if (e.ctrlKey && e.key === 'Enter') {
                        this.analyzeJWT();
                    }
                });
            }

            analyzeJWT() {
                const jwtInput = document.getElementById('jwtInput').value.trim();
                if (!jwtInput) {
                    this.showError('Please enter a JWT token');
                    return;
                }

                this.hideError();
                this.showLoading(true);
                this.findings = [];

                setTimeout(() => {
                    try {
                        this.performSecurityAnalysis(jwtInput);
                        this.displayResults();
                    } catch (error) {
                        this.showError('Error analyzing JWT: ' + error.message);
                    } finally {
                        this.showLoading(false);
                    }
                }, 500);
            }

            performSecurityAnalysis(jwt) {
                // Basic structure validation
                const parts = jwt.split('.');
                
                // Test 1: Malformed Token Structure
                this.testTokenStructure(jwt, parts);

                if (parts.length === 3) {
                    try {
                        const header = this.decodeBase64Url(parts[0]);
                        const payload = this.decodeBase64Url(parts[1]);
                        const signature = parts[2];

                        // Store decoded parts for display
                        this.header = header;
                        this.payload = payload;
                        this.signature = signature;

                        // Parse JSON
                        const headerObj = JSON.parse(header);
                        const payloadObj = JSON.parse(payload);

                        // Perform various security tests
                        this.testAlgorithmVulnerabilities(headerObj);
                        this.testSignatureIssues(signature, headerObj);
                        this.testPayloadSecurity(payloadObj);
                        this.testTimeBasedAttacks(payloadObj);
                        this.testClaimValidation(payloadObj);
                        this.testSensitiveDataExposure(payloadObj);
                        this.testKeyStrength(headerObj, signature);
                        this.testStorageRecommendations();
                        this.testInjectionVulnerabilities(payloadObj);

                    } catch (e) {
                        this.addFinding('critical', 'Token Structure', 'Invalid JSON in token parts: ' + e.message);
                    }
                }
            }

            testTokenStructure(jwt, parts) {
                if (parts.length !== 3) {
                    this.addFinding('critical', 'Token Structure', `Invalid token structure: Expected 3 parts, found ${parts.length}`);
                }

                if (jwt.includes(' ')) {
                    this.addFinding('medium', 'Token Structure', 'Token contains whitespace characters');
                }

                parts.forEach((part, index) => {
                    if (part.length === 0) {
                        this.addFinding('critical', 'Token Structure', `Empty segment at position ${index + 1}`);
                    }
                    
                    // Check for valid base64url characters
                    if (!/^[A-Za-z0-9_-]*$/.test(part)) {
                        this.addFinding('critical', 'Token Structure', `Invalid base64url characters in segment ${index + 1}`);
                    }
                });
            }

            testAlgorithmVulnerabilities(header) {
                const alg = header.alg;

                if (!alg) {
                    this.addFinding('critical', 'Algorithm', 'Missing algorithm in header');
                    return;
                }

                // Algorithm confusion attacks
                if (alg.toLowerCase() === 'none') {
                    this.addFinding('critical', 'Algorithm', 'Algorithm "none" detected - Token has no signature verification!');
                }

                if (alg === 'HS256' || alg === 'HS384' || alg === 'HS512') {
                    this.addFinding('high', 'Algorithm', `HMAC algorithm (${alg}) used - Vulnerable to key confusion attacks if expecting RSA`);
                }

                const weakAlgorithms = ['HS1', 'RS1', 'ES1', 'PS1'];
                if (weakAlgorithms.some(weak => alg.includes(weak))) {
                    this.addFinding('high', 'Algorithm', `Weak algorithm detected: ${alg} - Consider using stronger algorithms`);
                }

                if (!['HS256', 'HS384', 'HS512', 'RS256', 'RS384', 'RS512', 'ES256', 'ES384', 'ES512', 'PS256', 'PS384', 'PS512'].includes(alg)) {
                    this.addFinding('medium', 'Algorithm', `Non-standard algorithm: ${alg}`);
                }
            }

            testSignatureIssues(signature, header) {
                if (!signature || signature.length === 0) {
                    this.addFinding('critical', 'Signature', 'Missing signature - Token can be tampered with!');
                }

                if (signature.length < 20) {
                    this.addFinding('high', 'Signature', 'Signature appears too short - Possible weak signing key');
                }

                // Check for common test/weak signatures
                const weakSignatures = ['test', 'secret', 'password', '123456'];
                if (weakSignatures.some(weak => signature.toLowerCase().includes(weak))) {
                    this.addFinding('critical', 'Signature', 'Signature contains common weak pattern');
                }
            }

            testPayloadSecurity(payload) {
                const stringPayload = JSON.stringify(payload);

                // XSS detection
                const xssPatterns = [
                    /<script/i,
                    /javascript:/i,
                    /on\w+\s*=/i,
                    /<iframe/i,
                    /<object/i,
                    /<embed/i,
                    /document\./,
                    /window\./,
                    /eval\(/
                ];

                xssPatterns.forEach(pattern => {
                    if (pattern.test(stringPayload)) {
                        this.addFinding('high', 'XSS', `Potential XSS vector detected: ${pattern.source}`);
                    }
                });

                // SQL Injection patterns
                const sqlPatterns = [
                    /(\b(union|select|insert|update|delete|drop|create)\b.*\b(from|into|where|table)\b)/i,
                    /('|")\s*(or|and)\s*('|")?(\d|[a-z])/i,
                    /\b(exec|execute)\s*\(/i,
                    /;\s*(drop|delete|insert|update)/i
                ];

                sqlPatterns.forEach(pattern => {
                    if (pattern.test(stringPayload)) {
                        this.addFinding('high', 'SQL Injection', `Potential SQL injection pattern detected`);
                    }
                });

                // Check for privilege escalation attempts
                if (payload.role || payload.roles || payload.permissions) {
                    this.addFinding('info', 'Authorization', 'Token contains role/permission claims - Ensure proper server-side validation');
                    
                    const adminPatterns = /admin|root|superuser|administrator/i;
                    if (adminPatterns.test(stringPayload)) {
                        this.addFinding('high', 'Privilege Escalation', 'Token contains high-privilege role claims');
                    }
                }

                // Check for sensitive data
                const sensitiveFields = ['password', 'secret', 'api_key', 'apiKey', 'private_key', 'privateKey', 'ssn', 'creditCard'];
                Object.keys(payload).forEach(key => {
                    if (sensitiveFields.some(field => key.toLowerCase().includes(field.toLowerCase()))) {
                        this.addFinding('critical', 'Data Exposure', `Sensitive field "${key}" found in token payload`);
                    }
                });
            }

            testTimeBasedAttacks(payload) {
                const now = Math.floor(Date.now() / 1000);

                if (payload.exp) {
                    if (payload.exp < now) {
                        this.addFinding('high', 'Expiration', `Token is expired (expired ${this.formatTimeAgo(now - payload.exp)} ago)`);
                    } else if (payload.exp > now + 365 * 24 * 60 * 60) {
                        this.addFinding('medium', 'Expiration', 'Token has very long expiration (> 1 year)');
                    }
                } else {
                    this.addFinding('high', 'Expiration', 'Token has no expiration claim (exp) - Never expires!');
                }

                if (payload.iat) {
                    if (payload.iat > now) {
                        this.addFinding('high', 'Time Validation', 'Token issued in the future - Possible clock skew or tampering');
                    }
                } else {
                    this.addFinding('low', 'Time Validation', 'Token missing issued at (iat) claim');
                }

                if (payload.nbf) {
                    if (payload.nbf > now) {
                        this.addFinding('medium', 'Time Validation', 'Token not yet valid (nbf claim)');
                    }
                }
            }

            testClaimValidation(payload) {
                // Check required claims
                if (!payload.iss) {
                    this.addFinding('medium', 'Claims', 'Missing issuer (iss) claim - Cannot verify token source');
                }

                if (!payload.sub && !payload.user_id && !payload.userId) {
                    this.addFinding('low', 'Claims', 'Missing subject/user identifier claim');
                }

                if (!payload.aud) {
                    this.addFinding('medium', 'Claims', 'Missing audience (aud) claim - Token can be used on any service');
                }

                // Check for JWT ID for replay protection
                if (!payload.jti) {
                    this.addFinding('low', 'Claims', 'Missing JWT ID (jti) - No replay attack protection');
                }
            }

            testSensitiveDataExposure(payload) {
                // Check for PII
                const piiPatterns = {
                    email: /\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Z|a-z]{2,}\b/,
                    phone: /\b(?:\+?1[-.\s]?)?\(?([0-9]{3})\)?[-.\s]?([0-9]{3})[-.\s]?([0-9]{4})\b/,
                    ssn: /\b\d{3}-\d{2}-\d{4}\b/,
                    creditCard: /\b\d{4}[\s-]?\d{4}[\s-]?\d{4}[\s-]?\d{4}\b/
                };

                // Convert payload to string but exclude common ID fields from phone detection
                const payloadStr = JSON.stringify(payload);
                
                Object.entries(piiPatterns).forEach(([type, pattern]) => {
                    if (type === 'phone') {
                        // For phone numbers, check each value individually to avoid false positives
                        Object.entries(payload).forEach(([key, value]) => {
                            // Skip common ID fields that might be 10-digit numbers
                            if (!['sub', 'id', 'user_id', 'userId', 'account_id', 'accountId', 'customer_id', 'customerId'].includes(key)) {
                                if (typeof value === 'string' && pattern.test(value)) {
                                    this.addFinding('high', 'Data Exposure', `Potential phone number detected in field "${key}"`);
                                }
                            }
                        });
                    } else if (pattern.test(payloadStr)) {
                        this.addFinding('high', 'Data Exposure', `Potential ${type} PII detected in token`);
                    }
                });

                // Check payload size
                if (payloadStr.length > 1000) {
                    this.addFinding('medium', 'Data Exposure', 'Large payload size - Consider minimizing data in token');
                }

                // Internal system information
                const internalPatterns = ['internal', 'debug', 'stacktrace', 'error_details'];
                Object.keys(payload).forEach(key => {
                    if (internalPatterns.some(pattern => key.toLowerCase().includes(pattern))) {
                        this.addFinding('medium', 'Data Exposure', `Potential internal information in field: ${key}`);
                    }
                });
            }

            testKeyStrength(header, signature) {
                // Estimate key strength based on signature length
                const signatureBytes = this.base64UrlToBytes(signature);
                
                if (header.alg && header.alg.startsWith('HS')) {
                    if (signatureBytes < 32) {
                        this.addFinding('high', 'Key Strength', 'Weak signing key detected - Use at least 256-bit keys');
                    }
                }
            }

            testStorageRecommendations() {
                this.addFinding('info', 'Storage', 'Recommended: Store in httpOnly, secure cookies instead of localStorage');
                this.addFinding('info', 'Storage', 'Avoid storing JWTs in localStorage (XSS vulnerable) or URL parameters (logged)');
                this.addFinding('info', 'Transmission', 'Always transmit JWTs over HTTPS');
            }

            testInjectionVulnerabilities(payload) {
                const stringPayload = JSON.stringify(payload);

                // LDAP Injection
                const ldapPatterns = /[*()\\|&]/;
                if (ldapPatterns.test(stringPayload)) {
                    this.addFinding('medium', 'LDAP Injection', 'Potential LDAP injection characters detected');
                }

                // Command Injection
                const cmdPatterns = /[;&|`$()]/;
                if (cmdPatterns.test(stringPayload)) {
                    this.addFinding('medium', 'Command Injection', 'Potential command injection characters detected');
                }

                // NoSQL Injection
                if (stringPayload.includes('$') && (stringPayload.includes('{') || stringPayload.includes('['))) {
                    this.addFinding('medium', 'NoSQL Injection', 'Potential NoSQL injection pattern detected');
                }
            }

            decodeBase64Url(str) {
                str = str.replace(/-/g, '+').replace(/_/g, '/');
                while (str.length % 4) {
                    str += '=';
                }
                return atob(str);
            }

            base64UrlToBytes(str) {
                return Math.floor((str.length * 3) / 4);
            }

            formatTimeAgo(seconds) {
                const intervals = [
                    { label: 'year', seconds: 31536000 },
                    { label: 'month', seconds: 2592000 },
                    { label: 'day', seconds: 86400 },
                    { label: 'hour', seconds: 3600 },
                    { label: 'minute', seconds: 60 }
                ];

                for (const interval of intervals) {
                    const count = Math.floor(seconds / interval.seconds);
                    if (count >= 1) {
                        return `${count} ${interval.label}${count > 1 ? 's' : ''}`;
                    }
                }
                return `${seconds} seconds`;
            }

            addFinding(severity, category, message) {
                this.findings.push({ severity, category, message });
            }

            displayResults() {
                document.getElementById('results').style.display = 'block';

                // Display JWT parts
                document.getElementById('headerContent').textContent = this.formatJSON(this.header);
                document.getElementById('payloadContent').textContent = this.formatJSON(this.payload);
                document.getElementById('signatureContent').textContent = this.signature;

                // Display summary statistics
                this.displaySummaryStats();

                // Display findings
                this.displayFindings();
            }

            displaySummaryStats() {
                const severityCounts = {
                    critical: 0,
                    high: 0,
                    medium: 0,
                    low: 0,
                    info: 0
                };

                this.findings.forEach(finding => {
                    severityCounts[finding.severity]++;
                });

                const statsHtml = `
                    <div class="stat-card">
                        <div class="stat-number" style="color: #ff4336">${severityCounts.critical}</div>
                        <div class="stat-label">Critical</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number" style="color: #ff9800">${severityCounts.high}</div>
                        <div class="stat-label">High</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number" style="color: #ffc107">${severityCounts.medium}</div>
                        <div class="stat-label">Medium</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number" style="color: #4caf50">${severityCounts.low}</div>
                        <div class="stat-label">Low</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number" style="color: #2196f3">${severityCounts.info}</div>
                        <div class="stat-label">Info</div>
                    </div>
                `;

                document.getElementById('summaryStats').innerHTML = statsHtml;
            }

            displayFindings() {
                const groupedFindings = {};
                
                this.findings.forEach(finding => {
                    if (!groupedFindings[finding.category]) {
                        groupedFindings[finding.category] = [];
                    }
                    groupedFindings[finding.category].push(finding);
                });

                let findingsHtml = '';
                
                // Sort categories by severity
                const sortedCategories = Object.keys(groupedFindings).sort((a, b) => {
                    const severityOrder = { critical: 0, high: 1, medium: 2, low: 3, info: 4 };
                    const aMaxSeverity = Math.min(...groupedFindings[a].map(f => severityOrder[f.severity]));
                    const bMaxSeverity = Math.min(...groupedFindings[b].map(f => severityOrder[f.severity]));
                    return aMaxSeverity - bMaxSeverity;
                });

                sortedCategories.forEach(category => {
                    findingsHtml += `<div class="finding-category">`;
                    findingsHtml += `<h3>${category}</h3>`;
                    
                    groupedFindings[category]
                        .sort((a, b) => {
                            const severityOrder = { critical: 0, high: 1, medium: 2, low: 3, info: 4 };
                            return severityOrder[a.severity] - severityOrder[b.severity];
                        })
                        .forEach(finding => {
                            findingsHtml += `
                                <div class="finding-item severity-${finding.severity}">
                                    <span class="severity-badge badge-${finding.severity}">${finding.severity}</span>
                                    <span>${finding.message}</span>
                                </div>
                            `;
                        });
                    
                    findingsHtml += `</div>`;
                });

                if (this.findings.length === 0) {
                    findingsHtml = '<div class="finding-item severity-low"><span class="severity-badge badge-low">PASS</span><span>No security issues detected. Token appears to follow best practices.</span></div>';
                }

                document.getElementById('findingsContent').innerHTML = findingsHtml;
            }

            formatJSON(jsonStr) {
                try {
                    const obj = JSON.parse(jsonStr);
                    return JSON.stringify(obj, null, 2);
                } catch (e) {
                    return jsonStr;
                }
            }

            showError(message) {
                const errorEl = document.getElementById('errorMessage');
                errorEl.textContent = message;
                errorEl.style.display = 'block';
                document.getElementById('results').style.display = 'none';
            }

            hideError() {
                document.getElementById('errorMessage').style.display = 'none';
            }

            showLoading(show) {
                document.getElementById('loading').style.display = show ? 'block' : 'none';
                document.getElementById('analyzeBtn').disabled = show;
            }
        }

        // Initialize the analyzer
        const analyzer = new JWTSecurityAnalyzer();

        // Add example JWT for testing
        document.getElementById('jwtInput').placeholder = `Paste your JWT token here...

Example:
eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiaWF0IjoxNTE2MjM5MDIyfQ.SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c`;
    </script>
