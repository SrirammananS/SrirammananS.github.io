<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Embedded Presentation</title>
  <style>
    :root { color-scheme: light dark; }
    .embed {
      width: 100%;
      max-width: 700px;
      margin: 0 auto;
      border: 2px solid #dee1e5;
      border-radius: 6px;
      overflow: hidden;
      aspect-ratio: 16 / 12; /* ~700x525 */
      background: #fff;
    }
    /* Fallback for older browsers */
    @supports not (aspect-ratio: 1) {
      .embed { position: relative; height: 0; padding-top: 75%; }
      .embed > iframe { position: absolute; inset: 0; height: 100%; }
    }
    iframe { width: 100%; height: 100%; border: 0; display: block; }
  </style>
  <link rel="preconnect" href="https://app.presentations.ai" crossorigin />
</head>
<body>
  <div class="embed" id="ppt-embed">
    <iframe
      title="Presentations.ai deck"
      src="https://app.presentations.ai/view/cjgPFXdlCh"
      loading="lazy"
      referrerpolicy="strict-origin-when-cross-origin"
      allow="autoplay; clipboard-write; fullscreen; picture-in-picture"
      allowfullscreen>
    </iframe>
  </div>
  <noscript>This presentation requires JavaScript enabled to load efficiently.</noscript>
</body>
</html>
