<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Happy Independence Day 2025 – India</title>
  <meta name="description" content="Mobile‑friendly tricolor and cybersecurity-themed landing page to wish Happy Independence Day 2025 (India)." />
  <style>
    :root{
      --saffron:#FF9933;
      --white:#FFFFFF;
      --green:#138808;
      --chakra:#000080;
      --ink:#0b1020;
      --cyber:#0ff;
    }
    html,body{height:100%;}
    body{
      margin:0;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Cantarell,Noto Sans,Arial;
      color:var(--ink);
      background:linear-gradient(180deg,var(--saffron) 0 33.33%,var(--white) 33.33% 66.66%,var(--green) 66.66% 100%);
      display:grid;place-items:center;overflow-x:hidden;
    }
    .card{
      width:min(960px,92vw);
      background:rgba(255,255,255,0.92);
      backdrop-filter:saturate(1.3) blur(6px);
      border-radius:24px;
      padding:clamp(16px,4vw,40px);
      box-shadow:0 10px 30px rgba(0,0,0,0.15);
      text-align:center;
      position:relative;
    }
    .badge{font-size:12px;padding:6px 10px;border-radius:999px;background:var(--cyber);color:#000;font-weight:bold;display:inline-block;margin-bottom:8px;}
    h1{font-size:clamp(28px,7vw,48px);margin:8px 0 6px;line-height:1.1;}
    .sub{font-size:clamp(14px,3.8vw,18px);opacity:0.8;margin:0 0 12px;}
    .cyber-icon{font-size:24px;color:var(--cyber);margin-right:6px;}
    blockquote{margin:18px auto 0;max-width:60ch;font-size:clamp(16px,4.2vw,20px);line-height:1.45;color:#1a2a3a;}
    cite{display:block;margin-top:6px;font-style:normal;opacity:0.75;}
    .cta{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:18px 0 6px;}
    .btn{appearance:none;border:0;border-radius:999px;padding:12px 18px;cursor:pointer;font-weight:600;box-shadow:0 6px 14px rgba(0,0,0,0.12);}
    .btn-share{background:var(--chakra);color:white;}
    .btn-download{background:transparent;color:#0b2233;border:2px solid #0b2233;}
    footer{margin-top:18px;font-size:13px;opacity:0.75}
  </style>
</head>
<body>
  <main class="card">
    <span class="badge">By Srirammanan</span>
    <h1>Happy Independence Day 2025</h1>
    <p class="sub"><span class="cyber-icon">🛡️</span>India • 15 August 2025 • Cybersecurity for Freedom</p>
    <blockquote>
      <span>Freedom thrives where security stands guard.</span>
      <cite>— Srirammanan</cite>
    </blockquote>
    <div class="cta">
      <button class="btn btn-share" id="shareBtn" type="button">Share this greeting</button>
      <a class="btn btn-download" id="downloadBtn" href="#" download="independence-day-2025.png">Download as image</a>
    </div>
    <footer>
      Crafted for mobile. Tricolor with a cybersecurity edge.
    </footer>
  </main>
</body>
</html>
